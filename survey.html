<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل البرنامج - ماجان</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Cairo', sans-serif;
  background: #f5f5f5;
  padding: 40px 10px;
}

.container {
  max-width: 750px;
  margin: auto;
  background: white;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}

h1 {
  font-size: 24px;
  margin-bottom: 10px;
}

p {
  color: #555;
  margin-bottom: 20px;
}

.form-group {
  border: 1px solid #ddd;
  padding: 20px;
  margin-bottom: 15px;
  border-radius: 8px;
}

label {
  display: block;
  font-weight: bold;
  margin-bottom: 10px;
}

.required {
  color: red;
}

input, select, textarea {
  width: 100%;
  padding: 12px;
  border-radius: 6px;
  border: 1px solid #ccc;
  font-family: 'Cairo';
}

button {
  width: 100%;
  padding: 14px;
  background: #0b2345;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 18px;
  cursor: pointer;
}

button:hover {
  background: #091a34;
}
</style>
</head>

<body>

<div class="container">

<h1>تسجيل البرنامج</h1>
<p>
فضلاً أكمل البيانات المطلوبة لتحديد البرنامج المناسب لك.<br>
سنتواصل معك بعد استلام الطلب مباشرة.
</p>

<form>

<div class="form-group">
<label>الاسم الكامل <span class="required">*</span></label>
<input type="text" required>
</div>

<div class="form-group">
<label>رقم الهاتف (واتساب) <span class="required">*</span></label>
<input type="text" required>
</div>

<div class="form-group">
<label>البريد الإلكتروني (اختياري)</label>
<input type="email">
</div>

<div class="form-group">
<label>⭐ العمر <span class="required">*</span></label>
<select required>
<option>اختر</option>
<option>14 سنة</option>
<option>15 سنة</option>
<option>16 سنة</option>
<option>17 سنة</option>
<option>18 سنة وما فوق</option>
</select>
</div>

<div class="form-group">
<label>البرنامج المهتم به</label>
<select>
<option>اختر</option>
<option>البرامج الصيفية</option>
<option>القبول الجامعي</option>
<option>لغة إنجليزية / IELTS</option>
<option>طيران (ICAO)</option>
</select>
</div>

<div class="form-group">
<label>موعد السفر المتوقع</label>
<input type="date">
</div>

<div class="form-group">
<label>مدة الدراسة المطلوبة</label>
<select>
<option>اختر</option>
<option>أسبوعين</option>
<option>شهر</option>
<option>شهرين</option>
<option>3 أشهر</option>
</select>
</div>

<div class="form-group">
<label>مدة أخرى (اختياري)</label>
<input type="text">
</div>

<div class="form-group">
<label>المدينة المرغوبة للدراسة <span class="required">*</span></label>
<select required>
<option>اختر</option>
<option>لندن</option>
<option>مانشستر</option>
<option>بورنموث</option>
<option>ليفربول</option>
<option>إدنبرة</option>
<option>أكسفورد</option>
<option>برايتون</option>
</select>
</div>

<div class="form-group">
<label>مدينة أخرى</label>
<input type="text">
</div>

<div class="form-group">
<label>هل لديك ملاحظات أو احتياجات خاصة؟</label>
<textarea rows="4"></textarea>
</div>

<button type="submit">إرسال</button>

</form>

</div>

</body>
</html>
