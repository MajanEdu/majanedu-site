<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>استمارة التسجيل | ماجان</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Cairo',sans-serif;
  background:#f3efe2;
  margin:0;
  padding:15px;
}

.container{
  max-width:700px;
  margin:auto;
}

/* HERO */
.hero{
  background:linear-gradient(135deg,#0b2345,#173a67);
  border-radius:18px 18px 0 0;
  color:white;
  text-align:center;
  padding:25px 15px;
}

.logos{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-bottom:15px;
}

.logos img{
  height:55px;
  background:rgba(255,255,255,0.1);
  padding:8px;
  border-radius:10px;
}

.hero h1{
  font-size:28px;
  margin:0;
  font-weight:800;
}

/* INTRO */
.intro{
  background:white;
  padding:20px;
  border-radius:0 0 18px 18px;
  box-shadow:0 5px 20px rgba(0,0,0,0.08);
  margin-bottom:15px;
}

.intro h2{
  margin:0 0 8px;
  color:#0b2345;
}

/* FORM */
.box{
  background:white;
  padding:18px;
  border-radius:12px;
  margin-bottom:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

label{
  font-weight:700;
  display:block;
  margin-bottom:8px;
}

input,select,textarea{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-family:'Cairo';
  font-size:15px;
}

textarea{
  min-height:100px;
}

/* PHONE */
.phone{
  position:relative;
}

.phone span{
  position:absolute;
  left:10px;
  top:50%;
  transform:translateY(-50%);
  font-weight:700;
}

.phone input{
  padding-left:90px;
  direction:ltr;
}

/* BUTTON */
button{
  background:#0b57d0;
  color:white;
  border:none;
  padding:12px;
  width:100%;
  border-radius:8px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

button:hover{
  background:#0948ad;
}

/* MOBILE */
@media(max-width:600px){
  .hero h1{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- HERO -->
<div class="hero">
  <div class="logos">
    <img src="LOGO.jpg">
    <img src="saudi2030.png">
  </div>
  <h1>استمارة تحديد البرنامج المناسب</h1>
</div>

<!-- INTRO -->
<div class="intro">
  <h2>فضلاً أكمل البيانات المطلوبة</h2>
  <p>سنتواصل معك بعد استلام الطلب مباشرة.</p>
</div>

<form>

<div class="box">
  <label>الاسم الكامل *</label>
  <input type="text" required>
</div>

<div class="box">
  <label>رقم الهاتف (واتساب) *</label>
  <div class="phone">
    <span>🇸🇦 +966</span>
    <input type="tel" required>
  </div>
</div>

<div class="box">
  <label>البريد الإلكتروني (اختياري)</label>
  <input type="email">
</div>

<div class="box">
  <label>⭐ العمر *</label>
  <select required>
    <option>اختر</option>
    <option>14 سنة</option>
    <option>15 سنة</option>
    <option>16 سنة</option>
    <option>17 سنة</option>
    <option>18 سنة وما فوق</option>
  </select>
</div>

<div class="box">
  <label>البرنامج المهتم به</label>
  <select>
    <option>اختر</option>
    <option>البرامج الصيفية</option>
    <option>القبول الجامعي</option>
    <option>IELTS / لغة إنجليزية</option>
    <option>طيران (ICAO)</option>
  </select>
</div>

<div class="box">
  <label>موعد السفر المتوقع</label>
  <input type="date">
</div>

<div class="box">
  <label>مدة الدراسة المطلوبة</label>
  <select>
    <option>اختر</option>
    <option>أسبوعين</option>
    <option>شهر</option>
    <option>شهرين</option>
    <option>3 أشهر</option>
  </select>
</div>

<div class="box">
  <label>مدة أخرى</label>
  <input type="text">
</div>

<div class="box">
  <label>المدينة المطلوبة *</label>
  <select required>
    <option>اختر</option>
    <option>لندن</option>
    <option>مانشستر</option>
    <option>بورنموث</option>
    <option>ليفربول</option>
    <option>إدنبرة</option>
    <option>أكسفورد</option>
    <option>برايتون</option>
  </select>
</div>

<div class="box">
  <label>مدينة أخرى</label>
  <input type="text">
</div>

<div class="box">
  <label>ملاحظات (اختياري)</label>
  <textarea></textarea>
</div>

<button type="submit">إرسال</button>

</form>

</div>

</body>
</html>
